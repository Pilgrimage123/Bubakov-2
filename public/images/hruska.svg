<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft shadow -->
    <radialGradient id="pearShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#26170E" stop-opacity="0.36" />
      <stop offset="70%" stop-color="#26170E" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#26170E" stop-opacity="0" />
    </radialGradient>

    <!-- Warm ripe pear body gradient -->
    <linearGradient id="pearGrad" x1="25%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#D9F99D" />
      <stop offset="25%" stop-color="#EAB308" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </linearGradient>

    <!-- Stem gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="50" cy="90" rx="26" ry="7" fill="url(#pearShadow)" />

  <!-- Pear Stem (Stopka) -->
  <path d="M 49 32 C 48 24, 44 18, 41 13 C 44 12, 47 13, 49 15 C 52 20, 54 26, 53 32 Z" 
        fill="url(#stemGrad)" stroke="#1E150B" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Green Leaf (Lístek) -->
  <path d="M 48 22 C 58 13, 72 16, 76 22 C 72 29, 58 31, 48 22 Z" 
        fill="url(#leafGrad)" stroke="#1E150B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 48 22 Q 62 21 75 22" 
        fill="none" stroke="#274606" stroke-width="1.6" stroke-linecap="round" />

  <!-- Main Pear Body -->
  <path d="M 50 30 
           C 42 30, 38 42, 36 50 
           C 30 58, 22 66, 22 75 
           C 22 84, 34 89, 50 89 
           C 66 89, 78 84, 78 75 
           C 78 66, 70 58, 64 50 
           C 62 42, 58 30, 50 30 Z" 
        fill="url(#pearGrad)" stroke="#1E150B" stroke-width="3" stroke-linejoin="round" />

  <!-- Calyx at bottom (bubák) -->
  <ellipse cx="50" cy="88" rx="2.5" ry="1.2" fill="#3D1D08" stroke="#1E150B" stroke-width="1" />

  <!-- Natural Pear Freckles / Rustic Dots -->
  <g fill="#78350F" opacity="0.6">
    <circle cx="58" cy="62" r="1.1" />
    <circle cx="64" cy="69" r="1" />
    <circle cx="54" cy="74" r="1.2" />
    <circle cx="42" cy="78" r="0.9" />
    <circle cx="68" cy="76" r="0.9" />
    <circle cx="46" cy="58" r="0.8" />
    <circle cx="38" cy="68" r="1.1" />
    <circle cx="50" cy="46" r="0.7" />
  </g>

  <!-- Lada Style Curved Highlight -->
  <path d="M 33 55 C 28 62, 28 72, 34 78" 
        fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.55" />
  <path d="M 40 40 C 38 46, 36 50, 36 53" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" />
</svg>
